<line x1="150" y1="838" x2="450" y2="838" stroke="#0C0C0E" stroke-width="1.6"/>
<path d="M 450 838 L 442 833.5 L 442 842.5 Z" fill="#0C0C0E"/>
<circle cx="150" cy="838" r="3" fill="#0C0C0E"/>
<text x="300.0" y="829" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#0C0C0E" text-anchor="middle">4-Way Handshake M4 — ACK</text>
<text x="300.0" y="851" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" fill="#5C5C64" text-anchor="middle">port authorised, data flows</text>
<text x="16" y="942" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#5C5C64">No inner tunnel: unlike PEAP or EAP-TTLS, EAP-TLS authenticates with certificates alone — there is no second credential exchanged inside.</text>
</svg>