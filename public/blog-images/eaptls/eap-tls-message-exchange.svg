<text x="455.0" y="323" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" fill="#5C5C64" text-anchor="middle">Type 13 (TLS), Code 1 (Request)</text>
<line x1="150" y1="358" x2="760" y2="358" stroke="#D3002D" stroke-width="1.6"/>
<path d="M 760 358 L 752 353.5 L 752 362.5 Z" fill="#D3002D"/>
<circle cx="150" cy="358" r="3" fill="#D3002D"/>
