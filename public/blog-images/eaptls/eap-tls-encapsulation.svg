<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="100%" role="img" aria-label="How EAP-TLS is encapsulated across the two network segments">
<rect width="880" height="300" fill="#FAF8F5"/>
<text x="24" y="42" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0C0C0E">Supplicant to Authenticator</text>
<rect x="24" y="62" width="400" height="44" fill="#D3002D" stroke="#D9D9DE"/>
<text x="40" y="90" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#FAF8F5">EAP-TLS</text>
<rect x="38" y="114" width="372" height="44" fill="#0C0C0E" stroke="#D9D9DE"/>
<text x="54" y="142" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#FAF8F5">EAP</text>
<rect x="52" y="166" width="344" height="44" fill="#F1EEE9" stroke="#D9D9DE"/>
<text x="68" y="194" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#0C0C0E">EAPOL</text>
<rect x="66" y="218" width="316" height="44" fill="#F1EEE9" stroke="#D9D9DE"/>
<text x="82" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#0C0C0E">802.3 / 802.11 frame</text>
<text x="456" y="42" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0C0C0E">Authenticator to Auth Server</text>
<rect x="456" y="62" width="400" height="44" fill="#D3002D" stroke="#D9D9DE"/>
<text x="472" y="90" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#FAF8F5">EAP-TLS</text>
<rect x="470" y="114" width="372" height="44" fill="#0C0C0E" stroke="#D9D9DE"/>
<text x="486" y="142" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#FAF8F5">EAP</text>
<rect x="484" y="166" width="344" height="44" fill="#F1EEE9" stroke="#D9D9DE"/>
<text x="500" y="194" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#0C0C0E">RADIUS</text>
<rect x="498" y="218" width="316" height="44" fill="#F1EEE9" stroke="#D9D9DE"/>
<text x="514" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#0C0C0E">UDP 1812 / IP</text>
<text x="24" y="286" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#5C5C64">The same EAP conversation, carried by EAPOL on the LAN and by RADIUS across the network. The authenticator translates between the two and reads neither.</text>
</svg>