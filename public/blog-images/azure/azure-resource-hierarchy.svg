<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="100%" role="img" aria-label="Azure management hierarchy from management groups down to resources">
<rect width="820" height="420" fill="#FAF8F5"/>
<rect x="24" y="24" width="772" height="72" fill="#D3002D" stroke="#D9D9DE"/>
<text x="42" y="53" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#FAF8F5">Management groups</text>
<text x="42" y="74" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#FAF8F5" opacity="0.85">Governance scope above subscriptions. Policy and RBAC cascade downward.</text>
<path d="M 410.0 96 L 410.0 116" stroke="#D3002D" stroke-width="2"/>
<path d="M 405.0 110 L 410.0 117 L 415.0 110" fill="#D3002D"/>
<rect x="70" y="120" width="680" height="72" fill="#0C0C0E" stroke="#D9D9DE"/>
<text x="88" y="149" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#FAF8F5">Subscriptions</text>
<text x="88" y="170" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#FAF8F5" opacity="0.85">Unit of billing, scale and quota. A boundary for cost and access.</text>
<path d="M 410.0 192 L 410.0 212" stroke="#D3002D" stroke-width="2"/>
<path d="M 405.0 206 L 410.0 213 L 415.0 206" fill="#D3002D"/>
<rect x="116" y="216" width="588" height="72" fill="#B5B5BC" stroke="#D9D9DE"/>
<text x="134" y="245" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0C0C0E">Resource groups</text>
<text x="134" y="266" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#0C0C0E" opacity="0.85">Logical container for resources sharing a lifecycle.</text>
<path d="M 410.0 288 L 410.0 308" stroke="#D3002D" stroke-width="2"/>
<path d="M 405.0 302 L 410.0 309 L 415.0 302" fill="#D3002D"/>
<rect x="162" y="312" width="496" height="72" fill="#F1EEE9" stroke="#D9D9DE"/>
<text x="180" y="341" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#0C0C0E">Resources</text>
<text x="180" y="362" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#0C0C0E" opacity="0.85">Virtual machines, storage accounts, databases, networks.</text>
<text x="24" y="406" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5C5C64">Inheritance flows downward — a policy set at a management group applies to every subscription beneath it.</text>
</svg>