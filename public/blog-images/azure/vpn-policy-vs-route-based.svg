<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="100%" role="img" aria-label="Policy-based versus route-based VPN gateway comparison">
<rect width="820" height="360" fill="#FAF8F5"/>
<rect x="24" y="24" width="372" height="290" fill="#FAF8F5" stroke="#D9D9DE"/>
<rect x="24" y="24" width="372" height="6" fill="#D3002D"/>
<text x="46" y="68" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0C0C0E">Policy-based</text>
<text x="46" y="89" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#D3002D" letter-spacing="1.4">LEGACY · STATIC ROUTING</text>
<text x="46" y="122" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#5C5C64">Matches packets against a fixed</text>
<text x="46" y="143" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#5C5C64">access list of source and</text>
<text x="46" y="164" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#5C5C64">destination prefixes</text>
<text x="46" y="206" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#5C5C64">One tunnel only</text>
<text x="46" y="227" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#5C5C64">IKEv1 only</text>
<text x="46" y="248" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#5C5C64">No VNet-to-VNet, no coexistence</text>
<text x="46" y="269" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#5C5C64">Basic SKU only</text>
<rect x="420" y="24" width="372" height="290" fill="#FAF8F5" stroke="#D9D9DE"/>
<rect x="420" y="24" width="372" height="6" fill="#0C0C0E"/>
<text x="442" y="68" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#0C0C0E">Route-based</text>
<text x="442" y="89" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#0C0C0E" letter-spacing="1.4">MODERN STANDARD</text>
<text x="442" y="122" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#5C5C64">Treats the tunnel as a virtual</text>
<text x="442" y="143" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#5C5C64">interface (VTI) and uses the</text>
<text x="442" y="164" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#5C5C64">routing table</text>
<text x="442" y="206" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#5C5C64">Many tunnels</text>
<text x="442" y="227" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#5C5C64">IKEv2 supported</text>
<text x="442" y="248" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#5C5C64">VNet-to-VNet, P2S, ExpressRoute</text>
<text x="442" y="269" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#5C5C64">coexistence, active-active HA</text>
<text x="24" y="346" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5C5C64">Route-based is required for anything beyond a single simple site-to-site tunnel.</text>
</svg>