<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="100%" role="img" aria-label="Defense in depth layers from physical security to data">
<rect width="820" height="400" fill="#FAF8F5"/>
<rect x="24" y="20" width="772" height="42" fill="#D3002D" fill-opacity="0.1" stroke="#D3002D" stroke-opacity="0.35"/>
<text x="40" y="46" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0C0C0E">Physical security</text>
<text x="780" y="46" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5C5C64" text-anchor="end">Datacenter access control</text>
<rect x="46" y="70" width="728" height="42" fill="#D3002D" fill-opacity="0.23" stroke="#D3002D" stroke-opacity="0.35"/>
<text x="62" y="96" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0C0C0E">Identity and access</text>
<text x="758" y="96" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5C5C64" text-anchor="end">MFA, Conditional Access, least privilege</text>
<rect x="68" y="120" width="684" height="42" fill="#D3002D" fill-opacity="0.36" stroke="#D3002D" stroke-opacity="0.35"/>
<text x="84" y="146" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0C0C0E">Perimeter</text>
<text x="736" y="146" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5C5C64" text-anchor="end">DDoS protection, edge firewalls</text>
<rect x="90" y="170" width="640" height="42" fill="#D3002D" fill-opacity="0.49" stroke="#D3002D" stroke-opacity="0.35"/>
<text x="106" y="196" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0C0C0E">Network</text>
<text x="714" y="196" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5C5C64" text-anchor="end">Segmentation, NSGs, deny by default</text>
<rect x="112" y="220" width="596" height="42" fill="#D3002D" fill-opacity="0.62" stroke="#D3002D" stroke-opacity="0.35"/>
<text x="128" y="246" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0C0C0E">Compute</text>
<text x="692" y="246" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5C5C64" text-anchor="end">Endpoint protection, patching, secure access</text>
<rect x="134" y="270" width="552" height="42" fill="#D3002D" fill-opacity="0.75" stroke="#D3002D" stroke-opacity="0.35"/>
<text x="150" y="296" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0C0C0E">Application</text>
<text x="670" y="296" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5C5C64" text-anchor="end">Secure development, no embedded secrets</text>
<rect x="156" y="320" width="508" height="42" fill="#D3002D" fill-opacity="0.88" stroke="#D3002D" stroke-opacity="0.35"/>
<text x="172" y="346" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0C0C0E">Data</text>
<text x="648" y="346" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5C5C64" text-anchor="end">Encryption at rest and in transit</text>
<text x="24" y="388" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#5C5C64">Each layer slows an attack and limits blast radius. In almost all cases, attackers are after the data at the centre.</text>
</svg>